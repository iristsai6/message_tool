<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批次模板生成小工具</title>
    <link rel="icon" type="image/png" href="icon.png" />
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel CDN for compiling JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- SheetJS (XLSX) CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- 引入自訂樣式表 -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-200 selection:bg-amber-500 selection:text-slate-900 overflow-hidden h-screen w-full m-0">

    <!-- React 應用的掛載點 -->
    <div id="root" class="h-full w-full"></div>

    <!-- 引入 React 邏輯腳本 (注意：若使用本地雙擊開啟，需透過 local server 或確認瀏覽器允許讀取本地 babel script) -->
    <script type="text/babel" src="app.js"></script>
</body>
</html>
