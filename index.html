<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批次模板生成小工具 v2.0.0</title>
    <link rel="icon" type="image/png" href="icon.png" />

    <script>
        // 若網址帶有 Dropbox 專屬縮碼參數 (?d=...&r=...)，直接秒速跳轉至原始 Dropbox 連結（無確認頁）
        (function() {
            const params = new URLSearchParams(window.location.search);
            const d = params.get('d');
            const r = params.get('r');
            if (d) {
                const file = params.get('f') || '';
                const dl = params.get('dl') || '0';
                const target = `https://www.dropbox.com/scl/fi/${d}/${encodeURIComponent(file)}?rlkey=${r || ''}&dl=${dl}`;
                window.location.replace(target);
            }
        })();
    </script>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel CDN for compiling JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- SheetJS (XLSX) CDN -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- 引入外部 CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-200 selection:bg-amber-500 selection:text-slate-900 min-h-screen w-full m-0 flex flex-col">

    <!-- React 應用的掛載點 -->
    <div id="root" class="flex-1 flex flex-col w-full"></div>

    <!-- 引入外部 React 程式碼 -->
    <script type="text/babel" src="app.js"></script>
</body>
</html>
